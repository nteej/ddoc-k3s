apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules-cm
  namespace: observability
data:
  alerts.yaml: |
    groups:
      # ─────────────────────────────────────────
      # HOST / NODE HEALTH  (node_exporter)
      # ─────────────────────────────────────────
      - name: node.rules
        interval: 1m
        rules:
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node exporter unreachable ({{ $labels.instance }})"
              description: "node_exporter on {{ $labels.instance }} has been down for >2m. All pod alerts on this node may be suppressed."

          - alert: HostHighCpuLoad
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU on {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}%)"
              description: "CPU usage has exceeded 85% for 5+ minutes."

          - alert: HostCriticalCpuLoad
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "CRITICAL CPU on {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}%)"
              description: "CPU usage has exceeded 95% for 2+ minutes. System is under severe load."

          - alert: HostOutOfMemory
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Out of memory on {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}% free)"
              description: "Available memory dropped below 10% for 5+ minutes. OOM killer may activate."

          - alert: HostMemoryPressure
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 20
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Memory pressure on {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}% free)"
              description: "Available memory below 20% for 5+ minutes."

          - alert: HostDiskAlmostFull
            expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes * 100) < 15
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Disk almost full on {{ $labels.instance }}:{{ $labels.mountpoint }} ({{ $value | printf \"%.1f\" }}% free)"
              description: "Disk space below 15% available. Plan cleanup or expansion."

          - alert: HostDiskFull
            expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes * 100) < 5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Disk FULL on {{ $labels.instance }}:{{ $labels.mountpoint }} ({{ $value | printf \"%.1f\" }}% free)"
              description: "Disk space below 5%. Writes may fail — immediate action required."

          - alert: HostHighDiskIOUtilization
            expr: rate(node_disk_io_time_seconds_total[5m]) * 100 > 90
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High disk I/O on {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}%)"
              description: "Disk I/O utilization above 90% for 10+ minutes."

          - alert: HostNetworkErrors
            expr: rate(node_network_receive_errs_total[5m]) > 10 or rate(node_network_transmit_errs_total[5m]) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Network errors on {{ $labels.instance }} device {{ $labels.device }}"
              description: "Network error rate exceeds 10 errors/s."

          - alert: HostHighLoad
            expr: node_load15 / count by(instance) (count by(instance, cpu) (node_cpu_seconds_total)) > 2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High system load on {{ $labels.instance }} (load15={{ $value | printf \"%.2f\" }})"
              description: "15-minute load average is 2x the number of CPUs."

      # ─────────────────────────────────────────
      # KUBERNETES CLUSTER HEALTH
      # ─────────────────────────────────────────
      - name: kubernetes.rules
        interval: 1m
        rules:
          - alert: KubeStateMetricsDown
            expr: up{job="kube-state-metrics"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "kube-state-metrics is down"
              description: "Cannot get Kubernetes object state — alerting for pod/deploy health may be incomplete."

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} crash-looping ({{ $value | printf \"%.0f\" }} restarts/15m)"
              description: "Container {{ $labels.container }} is restarting frequently. Check logs for root cause."

          - alert: PodNotReady
            expr: max by(namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready ({{ $labels.phase }})"
              description: "Pod has been in non-Running phase for 10+ minutes."

          - alert: DeploymentReplicasMismatch
            expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica mismatch"
              description: "Desired replicas are not all available for 10+ minutes."

          - alert: ContainerOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} OOM killed"
              description: "Container was terminated by OOM killer. Consider increasing memory limits."

          - alert: ContainerHighCpuThrottle
            expr: rate(container_cpu_cfs_throttled_seconds_total{container!="",container!="POD"}[5m]) / rate(container_cpu_cfs_periods_total{container!="",container!="POD"}[5m]) > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "CPU throttled: {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} ({{ $value | printf \"%.0f%%\" }})"
              description: "Container is CPU-throttled >80% of the time. Raise CPU limits or reduce load."

          - alert: PersistentVolumeClaimNotBound
            expr: kube_persistentvolumeclaim_status_phase{phase!="Bound"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} not bound ({{ $labels.phase }})"
              description: "PVC has not bound for 5+ minutes. Storage provisioning may have failed."

      # ─────────────────────────────────────────
      # PROMETHEUS SELF-HEALTH
      # ─────────────────────────────────────────
      - name: prometheus.rules
        interval: 1m
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus target down: {{ $labels.job }}/{{ $labels.instance }}"
              description: "Scrape target has been unreachable for 5+ minutes. Metrics for this target are stale."

          - alert: PrometheusHighScrapeLatency
            expr: prometheus_target_interval_length_seconds{quantile="0.99"} > 60
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus slow scraping (p99={{ $value | printf \"%.1f\" }}s)"
              description: "99th-percentile scrape duration exceeds 60s — data gaps are likely."

          - alert: PrometheusTSDBCompactionFailing
            expr: increase(prometheus_tsdb_compactions_failed_total[1h]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus TSDB compaction failures"
              description: "TSDB compaction has failed in the last hour. Storage may grow unbounded."

      # ─────────────────────────────────────────
      # DYNADOC APPLICATION HEALTH
      # ─────────────────────────────────────────
      - name: dynadoc.rules
        interval: 30s
        rules:

          # ── Service availability ─────────────────────────────────────────────

          - alert: DynaDocServiceDown
            expr: |
              kube_deployment_status_replicas_available{namespace="dynadoc"} == 0
              and kube_deployment_spec_replicas{namespace="dynadoc"} > 0
            for: 2m
            labels:
              severity: critical
              namespace: dynadoc
            annotations:
              summary: "DynaDoc service down: {{ $labels.deployment }}"
              description: "Deployment {{ $labels.deployment }} has 0 available replicas for >2m. All traffic to this service is failing."

          - alert: DynaDocPodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total{namespace="dynadoc"}[15m]) * 60 * 15 > 3
            for: 3m
            labels:
              severity: critical
              namespace: dynadoc
            annotations:
              summary: "DynaDoc pod crash-looping: {{ $labels.pod }}/{{ $labels.container }}"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in 15 minutes. Check: kubectl logs -n dynadoc {{ $labels.pod }} -c {{ $labels.container }} --previous"

          - alert: DynaDocDeploymentDegraded
            expr: |
              (kube_deployment_spec_replicas{namespace="dynadoc"} - kube_deployment_status_replicas_available{namespace="dynadoc"}) > 0
            for: 10m
            labels:
              severity: warning
              namespace: dynadoc
            annotations:
              summary: "DynaDoc deployment degraded: {{ $labels.deployment }}"
              description: "{{ $labels.deployment }} has fewer available replicas than desired for 10+ minutes. Some requests may be failing."

          # ── Infrastructure dependencies ──────────────────────────────────────

          - alert: DynaDocKafkaBrokerDown
            expr: |
              kube_pod_status_ready{namespace="dynadoc", condition="true"}
                * on(pod) group_left() kube_pod_labels{namespace="dynadoc", label_app="kafka"}
              == 0
              or absent(kube_pod_status_ready{namespace="dynadoc", condition="true"}
                * on(pod) group_left() kube_pod_labels{namespace="dynadoc", label_app="kafka"})
            for: 2m
            labels:
              severity: critical
              namespace: dynadoc
            annotations:
              summary: "Kafka broker is down in dynadoc namespace"
              description: "No ready Kafka pods detected. PDF generation and email delivery pipelines are halted."

          - alert: DynaDocPostgresDown
            expr: |
              count(kube_pod_status_ready{namespace="dynadoc", condition="true"}
                * on(pod) group_left(label_app) kube_pod_labels{namespace="dynadoc", label_app=~".*-db"}) == 0
              or absent(kube_pod_status_ready{namespace="dynadoc", condition="true"}
                * on(pod) group_left(label_app) kube_pod_labels{namespace="dynadoc", label_app=~".*-db"})
            for: 2m
            labels:
              severity: critical
              namespace: dynadoc
            annotations:
              summary: "PostgreSQL database pod(s) down in dynadoc"
              description: "No ready database pods found in dynadoc namespace. All services depending on PostgreSQL will fail."

          # ── HTTP error rate (from Tempo span metrics → Prometheus) ────────────

          - alert: DynaDocHighHTTP5xxRate
            expr: |
              sum by(service_name) (
                rate(traces_spanmetrics_calls_total{
                  span_kind="SPAN_KIND_SERVER",
                  http_status_code=~"5.."
                }[5m])
              )
              /
              sum by(service_name) (
                rate(traces_spanmetrics_calls_total{
                  span_kind="SPAN_KIND_SERVER"
                }[5m])
              ) > 0.05
            for: 3m
            labels:
              severity: critical
              namespace: dynadoc
            annotations:
              summary: "High HTTP 5xx rate on {{ $labels.service_name }} ({{ $value | printf \"%.1f%%\" }})"
              description: "More than 5% of requests to {{ $labels.service_name }} are returning 5xx errors over the last 5 minutes."

          - alert: DynaDocElevatedHTTP5xxRate
            expr: |
              sum by(service_name) (
                rate(traces_spanmetrics_calls_total{
                  span_kind="SPAN_KIND_SERVER",
                  http_status_code=~"5.."
                }[5m])
              )
              /
              sum by(service_name) (
                rate(traces_spanmetrics_calls_total{
                  span_kind="SPAN_KIND_SERVER"
                }[5m])
              ) > 0.01
            for: 5m
            labels:
              severity: warning
              namespace: dynadoc
            annotations:
              summary: "Elevated HTTP 5xx rate on {{ $labels.service_name }} ({{ $value | printf \"%.1f%%\" }})"
              description: "More than 1% of requests to {{ $labels.service_name }} are returning errors."

          # ── Latency (from Tempo span metrics) ────────────────────────────────

          - alert: DynaDocHighP99Latency
            expr: |
              histogram_quantile(0.99,
                sum by(service_name, le) (
                  rate(traces_spanmetrics_latency_bucket{
                    span_kind="SPAN_KIND_SERVER"
                  }[5m])
                )
              ) > 3000
            for: 5m
            labels:
              severity: critical
              namespace: dynadoc
            annotations:
              summary: "High p99 latency on {{ $labels.service_name }} ({{ $value | printf \"%.0f\" }}ms)"
              description: "99th-percentile response time exceeded 3 seconds for 5+ minutes. Users are experiencing severe slowdown."

          - alert: DynaDocHighP95Latency
            expr: |
              histogram_quantile(0.95,
                sum by(service_name, le) (
                  rate(traces_spanmetrics_latency_bucket{
                    span_kind="SPAN_KIND_SERVER"
                  }[5m])
                )
              ) > 1500
            for: 5m
            labels:
              severity: warning
              namespace: dynadoc
            annotations:
              summary: "Elevated p95 latency on {{ $labels.service_name }} ({{ $value | printf \"%.0f\" }}ms)"
              description: "95th-percentile response time exceeded 1.5 seconds for 5+ minutes."

          # ── Resource pressure ─────────────────────────────────────────────────

          - alert: DynaDocContainerOOMKilled
            expr: |
              kube_pod_container_status_last_terminated_reason{namespace="dynadoc", reason="OOMKilled"} == 1
            for: 0m
            labels:
              severity: critical
              namespace: dynadoc
            annotations:
              summary: "OOM kill in DynaDoc: {{ $labels.pod }}/{{ $labels.container }}"
              description: "Container {{ $labels.container }} was killed by the OOM killer. Increase memory limits or investigate memory leak."

          - alert: DynaDocHighContainerMemory
            expr: |
              container_memory_working_set_bytes{namespace="dynadoc", container!="", container!="POD"}
              / (container_spec_memory_limit_bytes{namespace="dynadoc", container!="", container!="POD"} > 0)
              > 0.85
            for: 5m
            labels:
              severity: warning
              namespace: dynadoc
            annotations:
              summary: "High memory: {{ $labels.pod }}/{{ $labels.container }} ({{ $value | printf \"%.0f%%\" }})"
              description: "Container is using >85% of its memory limit. OOM kill risk — consider increasing the limit."

          - alert: DynaDocHighCPUThrottle
            expr: |
              rate(container_cpu_cfs_throttled_seconds_total{namespace="dynadoc", container!="", container!="POD"}[5m])
              / rate(container_cpu_cfs_periods_total{namespace="dynadoc", container!="", container!="POD"}[5m]) > 0.8
            for: 10m
            labels:
              severity: warning
              namespace: dynadoc
            annotations:
              summary: "CPU throttled: {{ $labels.pod }}/{{ $labels.container }} ({{ $value | printf \"%.0f%%\" }})"
              description: "DynaDoc container is CPU-throttled >80% of the time for 10+ minutes. PDF generation latency will increase."

          # ── PDF generation pipeline ───────────────────────────────────────────

          - alert: DynaDocPdfPipelineStall
            expr: |
              (
                kube_deployment_status_replicas_available{namespace="dynadoc", deployment=~"template-consumer|template-queue|file-consumer|file-queue"} == 0
              ) and (
                kube_deployment_spec_replicas{namespace="dynadoc", deployment=~"template-consumer|template-queue|file-consumer|file-queue"} > 0
              )
            for: 3m
            labels:
              severity: critical
              namespace: dynadoc
            annotations:
              summary: "PDF pipeline worker down: {{ $labels.deployment }}"
              description: "Kafka consumer or queue worker {{ $labels.deployment }} has no available replicas. PDF generation is halted — documents will accumulate in the queue."
