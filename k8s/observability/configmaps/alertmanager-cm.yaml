apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-cm
  namespace: observability
data:
  # Template — ${SMTP_PASSWORD} is substituted by the initContainer at pod start
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'ssl0.ovh.net:587'
      smtp_from: 'alerts@ddoc.fi'
      smtp_auth_username: 'admin@ddoc.fi'
      smtp_auth_password: '${SMTP_PASSWORD}'
      smtp_require_tls: true
      smtp_hello: 'ddoc.fi'

    templates:
      - /etc/alertmanager/templates/*.tmpl

    # ── Routing tree ──────────────────────────────────────────────────────────
    route:
      receiver: 'null'
      group_by: [alertname, namespace, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Discard Prometheus heartbeat
        - matchers:
            - alertname = Watchdog
          receiver: 'null'

        # Critical — page immediately, repeat every hour
        - matchers:
            - severity = critical
          receiver: critical-email
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1h
          continue: false

        # Warning — group for 5 min, repeat every 4 h
        - matchers:
            - severity = warning
          receiver: warning-email
          group_wait: 5m
          group_interval: 10m
          repeat_interval: 4h

    # ── Receivers ─────────────────────────────────────────────────────────────
    receivers:
      - name: 'null'

      - name: critical-email
        email_configs:
          - to: 'liyana.fin@gmail.com'
            send_resolved: true
            headers:
              subject: >-
                [CRITICAL 🔴] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
            html: |
              {{ template "email.critical.html" . }}

      - name: warning-email
        email_configs:
          - to: 'liyana.fin@gmail.com'
            send_resolved: true
            headers:
              subject: >-
                {{ if eq .Status "firing" }}[WARNING ⚠️]{{ else }}[RESOLVED ✅]{{ end }} {{ .GroupLabels.alertname }} — {{ .GroupLabels.namespace }}
            html: |
              {{ template "email.warning.html" . }}

    # ── Inhibition rules ──────────────────────────────────────────────────────
    inhibit_rules:
      # Critical suppresses warning for the same alert+namespace
      - source_matchers: [severity = critical]
        target_matchers: [severity = warning]
        equal: [alertname, namespace]

      # Node down suppresses all pod alerts on that node
      - source_matchers: [alertname = NodeDown]
        target_matchers: [alertname =~ "Pod.*|DynaDoc.*"]
        equal: [node]

      # DynaDoc service entirely down suppresses resource alerts for its containers
      - source_matchers: [alertname = DynaDocServiceDown]
        target_matchers: [alertname =~ "DynaDocHighContainerMemory|DynaDocHighCPUThrottle"]
        equal: [namespace]

  # ── Email HTML templates ───────────────────────────────────────────────────
  email_critical.tmpl: |
    {{ define "email.critical.html" }}
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 640px; margin: 0 auto; overflow: hidden; }
        .header { background: #dc2626; color: white; padding: 20px 28px; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .header p { margin: 4px 0 0; opacity: 0.85; font-size: 13px; }
        .body { padding: 24px 28px; }
        .alert-block { border-left: 4px solid #dc2626; background: #fef2f2; border-radius: 0 6px 6px 0; padding: 14px 16px; margin-bottom: 14px; }
        .alert-block.resolved { border-color: #16a34a; background: #f0fdf4; }
        .alert-name { font-size: 15px; font-weight: 700; color: #111; margin: 0 0 4px; }
        .alert-desc { font-size: 13px; color: #555; margin: 0; line-height: 1.5; }
        .meta { font-size: 12px; color: #888; margin-top: 8px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .badge-critical { background: #fee2e2; color: #dc2626; }
        .badge-resolved { background: #dcfce7; color: #16a34a; }
        .footer { background: #f9fafb; border-top: 1px solid #e5e7eb; padding: 14px 28px; font-size: 12px; color: #9ca3af; }
        .footer a { color: #6366f1; text-decoration: none; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="header">
          <h1>🔴 Critical Alert — DynaDoc</h1>
          <p>{{ .Alerts | len }} alert{{ if gt (len .Alerts) 1 }}s{{ end }} firing · {{ .GroupLabels.namespace }}</p>
        </div>
        <div class="body">
          {{ range .Alerts }}
          <div class="alert-block{{ if eq .Status "resolved" }} resolved{{ end }}">
            <div class="alert-name">
              {{ .Annotations.summary }}
              <span class="badge {{ if eq .Status "resolved" }}badge-resolved{{ else }}badge-critical{{ end }}">
                {{ .Status | toUpper }}
              </span>
            </div>
            <p class="alert-desc">{{ .Annotations.description }}</p>
            <div class="meta">
              Started: {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
              {{ if eq .Status "resolved" }}· Ended: {{ .EndsAt.Format "2006-01-02 15:04:05 UTC" }}{{ end }}
              {{ range $k, $v := .Labels }} · <b>{{ $k }}</b>: {{ $v }}{{ end }}
            </div>
          </div>
          {{ end }}
        </div>
        <div class="footer">
          DynaDoc Alerting · <a href="https://grafana.ddoc.fi">Open Grafana</a>
        </div>
      </div>
    </body>
    </html>
    {{ end }}

  email_warning.tmpl: |
    {{ define "email.warning.html" }}
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 640px; margin: 0 auto; overflow: hidden; }
        .header { background: #d97706; color: white; padding: 20px 28px; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .header p { margin: 4px 0 0; opacity: 0.85; font-size: 13px; }
        .body { padding: 24px 28px; }
        .alert-block { border-left: 4px solid #d97706; background: #fffbeb; border-radius: 0 6px 6px 0; padding: 14px 16px; margin-bottom: 14px; }
        .alert-block.resolved { border-color: #16a34a; background: #f0fdf4; }
        .alert-name { font-size: 15px; font-weight: 700; color: #111; margin: 0 0 4px; }
        .alert-desc { font-size: 13px; color: #555; margin: 0; line-height: 1.5; }
        .meta { font-size: 12px; color: #888; margin-top: 8px; }
        .footer { background: #f9fafb; border-top: 1px solid #e5e7eb; padding: 14px 28px; font-size: 12px; color: #9ca3af; }
        .footer a { color: #6366f1; text-decoration: none; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="header">
          <h1>{{ if eq .Status "resolved" }}✅ Resolved{{ else }}⚠️ Warning{{ end }} — DynaDoc</h1>
          <p>{{ .Alerts | len }} alert{{ if gt (len .Alerts) 1 }}s{{ end }} · {{ .GroupLabels.namespace }}</p>
        </div>
        <div class="body">
          {{ range .Alerts }}
          <div class="alert-block{{ if eq .Status "resolved" }} resolved{{ end }}">
            <div class="alert-name">{{ .Annotations.summary }}</div>
            <p class="alert-desc">{{ .Annotations.description }}</p>
            <div class="meta">
              {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
              {{ range $k, $v := .Labels }} · <b>{{ $k }}</b>: {{ $v }}{{ end }}
            </div>
          </div>
          {{ end }}
        </div>
        <div class="footer">
          DynaDoc Alerting · <a href="https://grafana.ddoc.fi">Open Grafana</a>
        </div>
      </div>
    </body>
    </html>
    {{ end }}
