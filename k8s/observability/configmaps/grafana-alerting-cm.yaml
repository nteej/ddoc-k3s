apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-cm
  namespace: observability
data:
  # Grafana Unified Alerting provisioning
  # Docs: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
  alerting.yaml: |
    apiVersion: 1

    # ── Contact points ────────────────────────────────────────────────────────
    contactPoints:
      - orgId: 1
        name: email-critical
        receivers:
          - uid: ddoc-email-critical
            type: email
            settings:
              addresses: liyana.fin@gmail.com
              singleEmail: false
              message: |
                🔴 CRITICAL — {{ len .Alerts }} alert(s) firing

                {{ range .Alerts }}
                Alert:       {{ .Labels.alertname }}
                Summary:     {{ .Annotations.summary }}
                Description: {{ .Annotations.description }}
                Severity:    {{ .Labels.severity }}
                Namespace:   {{ .Labels.namespace }}
                Started:     {{ .StartsAt }}
                -------------------------------------------------
                {{ end }}

                Open Grafana: https://grafana.ddoc.fi
            disableResolveMessage: false

      - orgId: 1
        name: email-warning
        receivers:
          - uid: ddoc-email-warning
            type: email
            settings:
              addresses: liyana.fin@gmail.com
              singleEmail: false
              message: |
                ⚠️ WARNING — {{ len .Alerts }} alert(s)

                {{ range .Alerts }}
                Alert:       {{ .Labels.alertname }}
                Summary:     {{ .Annotations.summary }}
                Description: {{ .Annotations.description }}
                Started:     {{ .StartsAt }}
                -------------------------------------------------
                {{ end }}

                Open Grafana: https://grafana.ddoc.fi
            disableResolveMessage: false

    # ── Notification policy ───────────────────────────────────────────────────
    policies:
      - orgId: 1
        receiver: email-warning        # default — catches everything not matched below
        group_by: [grafana_folder, alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          # Critical Grafana alerts → immediate email
          - receiver: email-critical
            matchers:
              - severity = critical
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 1h
            continue: false

          # Warning Grafana alerts → batched email
          - receiver: email-warning
            matchers:
              - severity = warning
            group_wait: 5m
            group_interval: 10m
            repeat_interval: 4h
