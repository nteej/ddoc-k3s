apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      # Render alertmanager.yml from the ConfigMap template,
      # substituting ${SMTP_PASSWORD} from the smtp secret.
      initContainers:
        - name: config-init
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext >/dev/null 2>&1
              envsubst < /template/alertmanager.yml > /rendered/alertmanager.yml
              echo "Config rendered:"
              grep -E "smtp_smarthost|smtp_from|smtp_auth_username|receiver" /rendered/alertmanager.yml | head -20
          env:
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alertmanager-smtp-secret
                  key: SMTP_PASSWORD
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: config-rendered
              mountPath: /rendered
          securityContext:
            runAsUser: 0
            runAsNonRoot: false

      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=0.0.0.0:9093
            - --log.level=info
          ports:
            - containerPort: 9093
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            # Rendered config (SMTP password injected by initContainer)
            - name: config-rendered
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            # HTML email templates
            - name: email-templates
              mountPath: /etc/alertmanager/templates
            - name: data
              mountPath: /alertmanager

      volumes:
        # ConfigMap with ${SMTP_PASSWORD} placeholder — read by initContainer
        - name: config-template
          configMap:
            name: alertmanager-cm
            items:
              - key: alertmanager.yml
                path: alertmanager.yml
        # emptyDir shared between initContainer and main container
        - name: config-rendered
          emptyDir: {}
        # Email HTML templates from ConfigMap
        - name: email-templates
          configMap:
            name: alertmanager-cm
            items:
              - key: email_critical.tmpl
                path: email_critical.tmpl
              - key: email_warning.tmpl
                path: email_warning.tmpl
        # Alertmanager state (silence, notification log) — persisted
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-svc
  namespace: observability
  labels:
    app: alertmanager
spec:
  selector:
    app: alertmanager
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
      name: http
